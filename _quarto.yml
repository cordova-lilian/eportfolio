project:
  type: website
  output-dir: docs

website:
  title: "Lilian Elizabeth Cordova Hernandez"
  favicon: images/favicon.ico
  site-url: "https://cordova-lilian.github.io/eportfolio"
  repo-url: "https://github.com/cordova-lilian/eportfolio"

  navbar:
    logo: images/logo.png
    background: primary
    search: true
    left:
      - href: index.qmd
        text: Home
        icon: house-door
      - href: about.qmd
        text: About
        icon: person
      - href: projects/index.qmd
        text: Projects
        icon: code-slash
      - href: reflection.qmd
        text: Reflection
        icon: journal-text
      - href: contact.qmd
        text: Contact
        icon: envelope
    right:
      - text: "CV"
        icon: file-earmark-pdf
        href: cv/cv.pdf
        target: _blank
      - icon: github
        href: "https://github.com/cordova-lilian"
        target: _blank

  page-footer:
    left: "© 2026 Lilian Elizabeth Cordova Hernandez. All rights reserved."
    center: "Built with [Quarto](https://quarto.org/)"
    right:
      - icon: github
        href: "https://github.com/cordova-lilian"
      - icon: linkedin
        href: "https://www.linkedin.com/in/linkedin.com/in/lilian-cordova-hernandez-916a37232/"
      - icon: envelope
        href: "https://www.linkedin.com/in/lilian-cordova-hernandez-916a37232/"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css: styles.scss
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true

execute:
  freeze: auto
