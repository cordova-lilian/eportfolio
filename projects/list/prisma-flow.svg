<svg viewBox="0 0 890 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Study selection flow: 1,799 records identified and screened, narrowing through 159 full texts sought and 154 assessed against three criteria, to 45 studies included. Exclusions shown at each step: 1,640 excluded on title and abstract, 5 full texts not retrieved, and 109 excluded at eligibility, broken down as 31 for insufficient architectural detail, 69 for no video or multimodal output, and 90 for no real-world validation.">
  <rect x="0" y="0" width="890" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2c47"/>
    </marker>
  </defs>

  <!-- Group labels -->
  <text x="110" y="15" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" letter-spacing="0.5" text-anchor="middle">IDENTIFICATION / SCREENING</text>

  <text x="430" y="15" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" letter-spacing="0.5" text-anchor="middle">ELIGIBILITY</text>
  <line x1="240" y1="24" x2="620" y2="24" stroke="#8bae2e" stroke-width="2"/>

  <text x="755" y="15" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#333333" letter-spacing="0.5" text-anchor="middle">INCLUDED</text>

  <!-- Main flow boxes -->
  <rect x="20" y="45" width="180" height="70" rx="4" fill="#ffffff" stroke="#1a2c47" stroke-width="1.5"/>
  <text x="110" y="75" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a2c47" text-anchor="middle">1,799</text>
  <text x="110" y="93" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Records identified</text>
  <text x="110" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">and screened</text>

  <rect x="240" y="45" width="150" height="70" rx="4" fill="#ffffff" stroke="#1a2c47" stroke-width="1.5"/>
  <text x="315" y="75" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a2c47" text-anchor="middle">159</text>
  <text x="315" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Full texts sought</text>

  <rect x="430" y="45" width="190" height="70" rx="4" fill="#ffffff" stroke="#1a2c47" stroke-width="1.5"/>
  <text x="525" y="75" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a2c47" text-anchor="middle">154</text>
  <text x="525" y="93" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Assessed against</text>
  <text x="525" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">three criteria</text>

  <rect x="660" y="45" width="190" height="70" rx="4" fill="#1a2c47" stroke="#1a2c47" stroke-width="1.5"/>
  <text x="755" y="75" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">45</text>
  <text x="755" y="93" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">Studies included</text>
  <text x="755" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">in the review</text>

  <!-- Horizontal solid arrows -->
  <line x1="200" y1="80" x2="236" y2="80" stroke="#1a2c47" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="390" y1="80" x2="426" y2="80" stroke="#1a2c47" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="620" y1="80" x2="656" y2="80" stroke="#1a2c47" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <!-- Dashed vertical arrows to exclusions -->
  <line x1="110" y1="115" x2="110" y2="148" stroke="#1a2c47" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowNavy)"/>
  <line x1="315" y1="115" x2="315" y2="148" stroke="#1a2c47" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowNavy)"/>
  <line x1="525" y1="115" x2="525" y2="148" stroke="#1a2c47" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowNavy)"/>

  <!-- Exclusion 1 -->
  <text x="110" y="175" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a1f3d" text-anchor="middle">1,640</text>
  <text x="110" y="193" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Excluded on title</text>
  <text x="110" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">and abstract</text>

  <!-- Exclusion 2 -->
  <text x="315" y="175" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a1f3d" text-anchor="middle">5</text>
  <text x="315" y="193" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Full texts not</text>
  <text x="315" y="206" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">retrieved</text>

  <!-- Exclusion 3 -->
  <text x="525" y="175" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a1f3d" text-anchor="middle">109</text>
  <text x="525" y="193" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Excluded at eligibility</text>

  <text x="430" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="start">Insufficient architectural detail</text>
  <text x="620" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="end">31</text>

  <text x="430" y="246" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="start">No video or multimodal output</text>
  <text x="620" y="246" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="end">69</text>

  <text x="430" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="start">No real-world validation</text>
  <text x="620" y="264" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333333" text-anchor="end">90</text>
</svg>
